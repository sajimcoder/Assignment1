<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cool Dark UI</title>
  <link rel="icon" type="image/x-icon" href="assets/logo.png">
  <link rel="stylesheet" href="style/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

</head>


<body class="raleway-uniquifier color-bg">
  <!-- header   -->
  <header class="header">
    <nav class="nav-bar">
      <h3 class="logo Primary-Color">PIGO</h3>
      <button class="Primary-btn">Sign Up</button>
    </nav>
    <!--banner-section-->
    <div class="banner-content">
      <h1 class="banner-heading">Cool Dark UI Template for Webflow Agencies!</h1>

      <button class="Primary-btn banner-btn">Stay Focused</button>

    </div>
  </header>


  <!-- action section -->
  <section class="action  ">
    <div class="action-content ">
      <h2 class="action-heading">See It in Action</h2>
      <p class="action-description">Explore the live preview and imagine your brand in this bold new look.</p>
      <button class="Primary-btn">Launch Live Preview</button>
    </div>
<div class="action-image-section">
      <img class="action-image" src="assets/wc-mini.png" alt="Live Preview Image">
    </div>
    

  </section>


</body>

</html>
